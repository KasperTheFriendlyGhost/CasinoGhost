# TestFlight uploads of the native app (apple/), on a GitHub-hosted Mac with Xcode 26.
#
# Run by hand: Actions → iOS → Run workflow. Builds the Rust engine for iOS, archives the
# SwiftUI app, signs it with your App Store Connect API key (cloud-managed certificates) and
# uploads it to TestFlight. Needs the secrets in docs/app-store/README.md under "CI signing".
# Everyday builds and tests run in the Apple workflow.
name: iOS

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Build number (leave empty to use the run number)
        type: string
        required: false

concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    name: Archive and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    # Create an "app-store" environment in Settings → Environments to require approval or to
    # scope the secrets to this job. Secrets set at repository level work too.
    environment: app-store
    env:
      TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
    steps:
      - name: Check signing secrets
        run: |
          missing=""
          for v in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then
            echo "::error::Missing:$missing. Add them under Settings → Secrets and variables → Actions (see docs/app-store/README.md)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Build the engine for iOS
        run: scripts/build-core-apple.sh --force
      - name: Install the App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          key="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          chmod 600 "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"
          version=$(grep -m1 'MARKETING_VERSION' apple/CasinoGhost.xcodeproj/project.pbxproj | sed -E 's/.*= ([0-9.]+);/\1/')
          echo "MARKETING_VERSION=$version" >> "$GITHUB_ENV"
      - name: Archive
        run: |
          xcodebuild -project apple/CasinoGhost.xcodeproj -scheme CasinoGhost -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/CasinoGhost.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -quiet archive
      - name: Sign and upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/CasinoGhost.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Summary
        run: |
          {
            echo "### Uploaded CasinoGhost $MARKETING_VERSION ($BUILD_NUMBER) to App Store Connect"
            echo "Processing takes 5–30 minutes. The build then appears under TestFlight in App Store Connect."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
